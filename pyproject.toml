[project]
name = "ncaa-mfb-football-data"
version = "0.1.0"
description = "Python producer for the stats.ncaa.org NCAA football (MFB) release datasets (parquet/csv), reshaping ncaa-mfb-football-raw into season-level tidy datasets."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "polars>=1.0,<2.0",
    "sportsdataverse",
]

[project.scripts]
ncaa-mfb-data-build = "ncaa_mfb_data_build.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["python"]
include = ["ncaa_mfb_data_build*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
# E712: polars bool masks are written `pl.col("c") == True` on purpose.
ignore = ["E712"]

[tool.ruff.lint.isort]
known-first-party = ["ncaa_mfb_data_build"]

# Game-grain datasets build from parsed payloads and pbp_cfbfastr runs the
# graduated sdv-py mapper, so the git-source pin is live (a git source, not a
# ../../sdv-py path -- a relative pin only builds on this sibling layout and
# fails on CI). For local sdv-py work: uv pip install -e ../sdv-py.
[tool.uv.sources]
sportsdataverse = { git = "https://github.com/sportsdataverse/sportsdataverse-py", branch = "main" }
