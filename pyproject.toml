[project]
name = "ncaa-mfb-football-data"
version = "0.1.0"
description = "Python producer for the stats.ncaa.org NCAA football (MFB) release datasets (parquet/csv), reshaping ncaa-mfb-football-raw into season-level tidy datasets."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "polars>=1.0,<2.0",
]

[project.scripts]
ncaa-mfb-data-build = "ncaa_mfb_data_build.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["python"]
include = ["ncaa_mfb_data_build*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
# E712: polars bool masks are written `pl.col("c") == True` on purpose.
ignore = ["E712"]

[tool.ruff.lint.isort]
known-first-party = ["ncaa_mfb_data_build"]

# No sportsdataverse dependency yet: the -raw repo already parses (sdv-py
# cfb_ncaa_pbp/cfb_ncaa_box run inside its stage 05), so this repo only
# re-keys committed parquet. Add the git-source pin (see ncaa-wbb-hoops-data
# [tool.uv.sources]) the day a dataset here needs an sdv-py parser.
